name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python3 -m venv .venv311
          source .venv311/bin/activate
          pip install -e .
          pip install pytest
      - name: Run tests
        run: |
          source .venv311/bin/activate
          pytest tests/

  swift-build:
    # Package.swift needs swift-tools-version 6.0, which macos-14 (Swift 5.10) lacks.
    runs-on: macos-15
    env:
      # The app depends on a local FluidAudio checkout (see macos/MeetingPilot/Package.swift).
      # The directory must be named `source`: Package.swift refers to it by that package identity.
      FLUID_AUDIO_SOURCE: ${{ github.workspace }}/../FluidAudio/source
      FLUID_AUDIO_REV: b68f484789d81fda21efbf81e2ca9fcfd9dc22aa
    steps:
      - uses: actions/checkout@v4
      - name: Fetch FluidAudio
        run: |
          git init "$FLUID_AUDIO_SOURCE"
          git -C "$FLUID_AUDIO_SOURCE" fetch --depth=1 https://github.com/FluidInference/FluidAudio.git "$FLUID_AUDIO_REV"
          git -C "$FLUID_AUDIO_SOURCE" checkout FETCH_HEAD
      - name: Build
        working-directory: macos/MeetingPilot
        run: swift build
      - name: Test
        working-directory: macos/MeetingPilot
        run: swift test
