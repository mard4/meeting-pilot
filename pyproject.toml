[project]
name = "transcribe-to-notion"
version = "0.1.0"
description = "Automatic Teams meeting post-processing with on-device transcription, summaries, and publishing."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
  "certifi>=2025.1.31",
  "notion-client>=2.3.0",
  "pymongo>=4.8.0",
  "requests>=2.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]
build = [
  "pyinstaller>=6.22",
]

[project.scripts]
transcribe-to-notion = "transcribe_to_notion.cli:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
